<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#12372f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="رحلاتي" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>رحلاتي</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f0e7;color:#12372f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{text-align:center;width:min(360px,100%);padding:30px 22px;border:1px solid rgba(184,145,76,.28);border-radius:26px;background:rgba(255,255,255,.72);box-shadow:0 18px 50px rgba(18,55,47,.10)}
    .seal{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:#12372f;color:#e8c887;font-size:30px;border:2px solid #caa45d}
    .k{letter-spacing:.2em;font-size:11px;color:#b97750;font-weight:800}.card h1{margin:6px 0 4px;font-size:28px}.card p{margin:0;color:#777168;font-size:14px}
  </style>
  <script>
    (function(){
      if(location.pathname!=='/'&&location.pathname!=='/index.html')return;
      var v=localStorage.getItem('rahalati-active-version')||localStorage.getItem('rahalati-last-opened-candidate')||'3.2.2';
      if(!/^\d+\.\d+\.\d+$/.test(v))v='3.2.2';
      localStorage.setItem('rahalati-active-version',v);
      location.replace('/releases/v'+v+'/');
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="seal">✦</div>
    <div class="k">RAHALATI</div>
    <h1>رحلاتي</h1>
    <p>جاري فتح آخر إصدار مستخدم…</p>
  </div>
</body>
</html>
